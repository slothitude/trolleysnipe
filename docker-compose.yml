services:
  trolleysnipe:
    build: .
    container_name: trolleysnipe
    restart: unless-stopped
    ports:
      - "5010:5000"
    volumes:
      - trolleysnipe-data:/app/data
    environment:
      - FLASK_DEBUG=0
      - SECRET_KEY=${SECRET_KEY:-trolleysnipe-prod}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  trolleysnipe-data:
